# Place this file in your repo at:  .github/workflows/build.yml
name: Build ROM
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: make
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: shattered-crown-rom
          path: shattered_crown.gba
